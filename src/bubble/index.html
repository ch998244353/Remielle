<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>蕾米埃尔消息</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-side="right">
    <div class="bubble">
      <p id="plain-text" class="plain-text"></p>
      <section id="project-message" class="project-message" hidden>
        <header class="message-title">
          <span id="source-name"></span><span aria-hidden="true"> · </span><span id="project-name" class="project-name"></span>
        </header>
        <pre id="message-detail" class="message-detail"></pre>
      </section>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
